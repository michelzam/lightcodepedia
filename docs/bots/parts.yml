# The public parts catalogue — a few component parts for the site's demos.
# A course reads its own catalogue from the vault (agent.md, botText).
dataset:
  name: a dataset — rows that every face reads
  module: Components · Dataset
  lines: |
    ```csv
    name,fee
    Rex,120
    Mila,90
    ```
    {: .dataset #TODO_YOUR_DATASET }
  adapt: the rows are yours; the word after # is the id every face names
datagrid:
  name: a datagrid on a dataset
  module: Components · Datagrid
  lines: |
    [Title](#)
    {: .datagrid source="TODO_YOUR_DATASET" }
  adapt: source names the dataset's id — the word after # in its decoration
form:
  name: a form that follows a datagrid — it shows the selected row
  module: Components · Form
  lines: |
    [Title](#)
    {: .form master="TODO_YOUR_GRID" }
  adapt: the datagrid needs an id of its own — add #TODO_YOUR_GRID to its decoration, then name it here
query:
  name: a query on a dataset — its answer is a dataset too
  module: Components · Query
  lines: |
    ```sql
    SELECT * FROM TODO_YOUR_DATASET
    ```
    {: .query bind="TODO_YOUR_DATASET" #TODO_YOUR_QUERY }
  adapt: bind names the dataset; the id after # is what a face reads next
chart:
  name: a chart on a dataset
  module: Components · Chart
  lines: |
    [Title](#)
    {: .chart source="TODO_YOUR_DATASET" x="TODO_A_COLUMN" y="TODO_A_COLUMN" }
  adapt: x and y name two columns of the dataset
button:
  name: a button — a link with one line under it
  module: Components · Button
  lines: |
    [Label](#)
    {: .button #TODO_YOUR_BUTTON }
  adapt: the label is the link's text; the id lets Python find it
