# The parts catalogue — the exact lines of each part, as the course taught
# them, with the module where the learner first typed it (Michel,
# 2026-10-09: "offering code snippets based on lessons learned since
# module 04"). The builder names a key; the page shows these lines
# verbatim. Placeholders are plain ids (TODO_YOUR_DATASET, TODO_YOUR_GRID…): on the
# page they show as broken wires until the learner puts their own id in.
dataset:
  name: a dataset — rows that every face reads
  module: Module 04 · Dogs
  lines: |
    ```csv
    name,fee
    Rex,120
    Mila,90
    ```
    {: .dataset #TODO_YOUR_DATASET }
  adapt: the rows are yours; the word after # is the id every face names
datagrid:
  name: a datagrid on a dataset
  module: Module 04 · Dogs
  lines: |
    [Title](#)
    {: .datagrid source="TODO_YOUR_DATASET" }
  adapt: source names the dataset's id — the word after # in its decoration
form:
  name: a form that follows a datagrid — it shows the selected row
  module: Module 04 · Three Faces
  lines: |
    [Title](#)
    {: .form master="TODO_YOUR_GRID" }
  adapt: the datagrid needs an id of its own — add #TODO_YOUR_GRID to its decoration, then name it here
chart:
  name: a chart on a dataset
  module: Module 04 · Three Faces
  lines: |
    [Title](#)
    {: .chart source="TODO_YOUR_DATASET" x="TODO_A_COLUMN" y="TODO_A_COLUMN" }
  adapt: x and y name two columns of the dataset
query:
  name: a query on a dataset — its answer is a dataset too
  module: Module 04 · Three Faces
  lines: |
    ```sql
    SELECT * FROM TODO_YOUR_DATASET
    ```
    {: .query bind="TODO_YOUR_DATASET" #TODO_YOUR_QUERY }
  adapt: bind names the dataset; the id after # is what a face reads next
button:
  name: a button — a link with one line under it
  module: Module 04 · First Screen
  lines: |
    [Label](#)
    {: .button #TODO_YOUR_BUTTON }
  adapt: the label is the link's text; the id lets Python find it
onclick:
  name: what a button does — a few lines of Python right under it
  module: Module 05 · The Follow-Up List
  lines: |
    ```python
    button.text = "✅ Done"
    ```
    {: .onclick }
  adapt: right under the button's decoration; button is the one pressed, button.page.<id> reaches any component
mark_row:
  name: a button that writes today into the datagrid's selected row, then selects the next
  module: Module 05 · The Follow-Up List
  lines: |
    [Label](#)
    {: .button #TODO_YOUR_BUTTON }
    ```python
    grid = button.page.TODO_YOUR_GRID
    grid.row.TODO_A_COLUMN = weekday()
    grid.next()
    ```
    {: .onclick }
  adapt: TODO_YOUR_GRID is the datagrid's id, TODO_A_COLUMN the column that gets today's day
cell:
  name: a live number inside a sentence
  module: Module 05 · The Follow-Up List
  lines: |
    {= TODO_YOUR_DATASET.count } families are waiting.
  adapt: any dataset or query id, then .count
visible:
  name: a gate — the part shows only when there is something to show
  module: Module 02 · Gates
  lines: |
    [Title](#)
    {: .datagrid source="TODO_YOUR_QUERY" visible="= TODO_YOUR_QUERY.count" }
  adapt: the same id twice — what it reads, and what must be more than zero
beside:
  name: a part drawn next to the one above
  module: Module 04 · Three Faces
  lines: |
    [Title](#)
    {: .chart source="TODO_YOUR_DATASET" x="TODO_A_COLUMN" y="TODO_A_COLUMN" beside="true" }
  adapt: beside goes on the second part; the first stays as it is
feature:
  name: a check — Gherkin, steps in Python, reading your parts by id
  module: Module 05 · The Proof
  lines: |
    ```gherkin
    Feature: The page does what it says
      Scenario: The table shows rows
        Given my page
        :::python
        self.grid = self.page.TODO_YOUR_GRID
        :::
        Then it shows rows
        :::python
        assert self.grid.rows, "no rows yet"
        :::
    ```
    {: .feature #TODO_YOUR_CHECK visible="true" }
  adapt: self.page.<id> reaches any part by its id; visible="true" shows the check on the page
then_step:
  name: one more step for a check — a Then, and the assert that proves it
  module: Module 05 · The Proof
  lines: |2
        Then TODO_YOUR_PROMISE_IN_PLAIN_WORDS
        :::python
        assert TODO_YOUR_CONDITION, "what is wrong, said in one sentence"
        :::
  adapt: inside the check's fence, under its last :::; the words say what must be true, the assert proves it
persona:
  name: who this is for — a persona card
  module: Module 03 · Who
  lines: |
    ```yaml
    name: Sam
    role: Shelter coordinator
    goal: call every family back
    ```
    {: .persona #TODO_YOUR_PERSONA }
  adapt: three lines at least — name, role, goal
pitch:
  name: why — a pitch that reads the persona
  module: Module 03 · Why
  lines: |
    ```yaml
    product: Shelter Desk
    need: nobody is forgotten
    benefit: one list, one button
    ```
    {: .pitch #TODO_YOUR_PITCH persona="TODO_YOUR_PERSONA" }
  adapt: persona names the card it reads
