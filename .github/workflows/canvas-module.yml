name: Course module → Canvas

# The module-delivery gate — manual only, fired from the material board's
# 📦 To Canvas button. Browsers cannot call Canvas (its CORS policy), so
# tools/canvas_module.py runs here, where the token lives in an Actions
# secret: 📦 the module already standing for module XX, under whatever name
# the teacher gave it (a new one only when the number has none), 📜 Module XX
# holding the scoped /go iframe, ⚙️ Quiz XX pushed lint-gated — everything
# unpublished, and the verdict rides back on the orphan-blob channel.
#
# MULTI-COURSE (Michel, 2026-08-29): the course dir travels with the
# dispatch, and each course's own __course.yml names its Canvas course,
# host and the NAME of the token secret (canvas_token, default
# CANVAS_TOKEN) — so BUILD-AI on uws-ce and 410 on uws ride one gate,
# and the next in-person 410 is one __course.yml away.

on:
  workflow_dispatch:
    inputs:
      module:
        description: "module folder name, e.g. module_05"
        required: true
      course:
        description: "course dir under courses/, e.g. micro_build_ai"
        required: false
        default: "micro_build_ai"

permissions:
  contents: write   # the verdict travels as an orphan blob
  statuses: write   # ...announced by a commit status the author key can read

jobs:
  deliver:
    # lab-only; if this file ever leaks through a publish, it stays inert
    if: github.repository == 'michelzam/lightcodelab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the course wiring
        id: wiring
        env:
          COURSE_DIR: ${{ inputs.course }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, yaml
          cdir = os.environ["COURSE_DIR"].strip()
          ok = re.fullmatch(r"[a-z0-9_]+", cdir)
          w = {}
          if ok:
              try: w = yaml.safe_load(open("courses/%s/__course.yml" % cdir)) or {}
              except FileNotFoundError: pass
          print("cdir=%s" % (cdir if ok else ""))
          print("course=%s" % str(w.get("canvas_course") or "").strip())
          print("host=%s" % (w.get("canvas_host") or "https://uwm.instructure.com"))
          print("token_name=%s" % (w.get("canvas_token") or "CANVAS_TOKEN"))
          PY

      - name: Guard — everything named, token present
        run: |
          # the guard's words ARE the verdict when it stops the run — say
          # them into the blob, not only the log (field-caught 2026-08-26:
          # the console showed the fallback line, the reason stayed here)
          fail=0
          say() { echo "::error::$1"; echo "❌ $1" >> /tmp/out.txt; }
          if [ -z "${{ steps.wiring.outputs.cdir }}" ]; then
            say "course must be a plain dir name (a-z, 0-9, _), got '${{ inputs.course }}'"; fail=1
          fi
          case "${{ inputs.module }}" in
            module_[0-9][0-9]) ;;
            *) say "module must look like module_05, got '${{ inputs.module }}'"; fail=1;;
          esac
          if [ ! -d "courses/${{ steps.wiring.outputs.cdir }}/${{ inputs.module }}" ]; then
            say "courses/${{ inputs.course }}/${{ inputs.module }} does not exist"; fail=1
          fi
          if [ -z "${{ steps.wiring.outputs.course }}" ]; then
            say "No canvas_course in courses/${{ inputs.course }}/__course.yml"; fail=1
          fi
          if [ -z "${{ secrets[steps.wiring.outputs.token_name] }}" ]; then
            say "No ${{ steps.wiring.outputs.token_name }} secret — lab repo → Settings → Secrets and variables → Actions."; fail=1
          fi
          exit $fail

      - name: Deliver the module
        env:
          CANVAS_TOKEN: ${{ secrets[steps.wiring.outputs.token_name] }}
          CANVAS_HOST: ${{ steps.wiring.outputs.host }}
        run: |
          set -o pipefail
          python3 tools/canvas_module.py "courses/${{ steps.wiring.outputs.cdir }}/${{ inputs.module }}" \
            --course "${{ steps.wiring.outputs.course }}" 2>&1 | tee /tmp/out.txt
          {
            echo "## 📦 ${{ inputs.course }}/${{ inputs.module }} → course ${{ steps.wiring.outputs.course }}"
            echo '```'
            cat /tmp/out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report to the console
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch /tmp/out.txt
          [ -s /tmp/out.txt ] || echo "The run stopped before delivering — its guard names the missing piece." > /tmp/out.txt
          STATE="${{ job.status == 'success' && 'success' || 'failure' }}"
          BLOB=$(jq -n --rawfile c /tmp/out.txt '{content: $c, encoding: "utf-8"}' \
            | curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" -d @- \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" | jq -r .sha)
          jq -n --arg s "$STATE" --arg d "$BLOB" \
                '{state: (if $s == "success" then "success" else "failure" end),
                  context: "lc/canvas-module", description: $d}' \
            | curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" -d @- \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            | jq -r 'if .id then "filed status \(.id) → blob" else "status refused: \(.message)" end'
