name: Publish LC bricks

# Continuous delivery for the @karmicsoft/lc-* packages.
# Bump a package's version (semver) and merge to main → this tests everything,
# then publishes ONLY the packages whose version isn't on npm yet (idempotent:
# unchanged versions are skipped, so it never republishes or errors).

on:
  push:
    branches: ["main"]
    paths:
      - "packages/lc-*/**"
      - "packages/package.json"
      - ".github/workflows/publish-bricks.yml"
  workflow_dispatch:

permissions:
  contents: write      # push version tags
  id-token: write      # npm trusted publishing (OIDC) + provenance

concurrency:
  group: "publish-bricks"
  cancel-in-progress: false

jobs:
  test-and-publish:
    # Public repo only — npm provenance requires a public repo, and each
    # package's npm trusted publisher names this repo and this file.
    if: github.repository == 'michelzam/lightcodepedia'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # trusted publishing needs npm 11.5.1+; no token to expire (2026-10-13)
      - name: npm with trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Install
        run: npm install

      - name: Test (both bricks + SSOT drift guard)
        run: npm test

      # trusted publishing only: no token in the job, so a refused OIDC
      # exchange says why instead of falling back to a dead token
      - name: Publish changed versions (semver-gated, idempotent)
        run: |
          set -e
          published=""
          # the package list IS the workspace list — a new brick (lc-record,
          # lc-map…) publishes as soon as it is a workspace, never forgotten here
          for pkg in $(node -p "require('./package.json').workspaces.join(' ')"); do
            name=$(node -p "require('./$pkg/package.json').name")
            ver=$(node -p "require('./$pkg/package.json').version")
            # a brick marked private is HELD: tested like the others, never
            # published until Michel flips the flag (lc-patch, lc-gateway 0.1.0)
            if [ "$(node -p "require('./$pkg/package.json').private === true")" = "true" ]; then
              echo "· $name@$ver is private — held"
              continue
            fi
            onnpm=$(npm view "$name@$ver" version 2>/dev/null || true)
            if [ "$onnpm" = "$ver" ]; then
              echo "· $name@$ver already on npm — skip"
            else
              echo "↑ publishing $name@$ver"
              ( cd "$pkg" && npm publish --provenance --access public )
              git tag "$pkg-v$ver" || true
              published="$published $pkg-v$ver"
            fi
          done
          if [ -n "$published" ]; then git push --tags || true; fi
          echo "Published:${published:- (nothing new)}"
