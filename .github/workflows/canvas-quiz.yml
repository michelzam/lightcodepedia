name: Quiz → Canvas

# The quiz gate — manual only, fired from the classroom console
# (📝 Quiz → Canvas). Lints the spec first (tells + greppable keys) and
# REFUSES a quiz an outsider could pass; then writes it to Canvas
# UNPUBLISHED, so nobody sits a quiz the teacher has not read. Runs here
# because a browser cannot reach Canvas (CORS) — the desk on /lab/canvas
# still lints live, this gate is its arm.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "push = write unpublished · peek = print what Canvas stores"
        type: choice
        options: [push, peek]
        default: push
      spec:
        description: "quiz spec to push (a __quiz/canvas.md, yaml also accepted)"
        default: "courses/micro_build_ai/module_05/__quiz/canvas.md"
      course:
        description: "Canvas course # (blank = courses/micro_build_ai/__course.yml)"
        default: ""

permissions:
  contents: write   # the verdict travels as an orphan blob
  statuses: write   # ...announced by a commit status the author key can read

jobs:
  push:
    # lab-only; if this file ever leaks through a publish, it stays inert
    if: github.repository == 'michelzam/lightcodelab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the course wiring
        id: wiring
        run: |
          python3 - "$COURSE_OVERRIDE" <<'PY' >> "$GITHUB_OUTPUT"
          import sys, yaml
          # __course.yml is the course's ONE wiring file — the same one the
          # Publish courses gate reads. The org is the vault's owner half.
          w = yaml.safe_load(open("courses/micro_build_ai/__course.yml"))
          print("course=%s" % (sys.argv[1].strip() or str(w.get("canvas_course") or "").strip()))
          print("host=%s" % (w.get("canvas_host") or "https://uwm.instructure.com"))
          PY
        env:
          COURSE_OVERRIDE: ${{ inputs.course }}

      - name: Guard — everything named, every key present
        run: |
          fail=0
          [ -f "${{ inputs.spec }}" ] || { echo "::error::No such spec: ${{ inputs.spec }}"; fail=1; }
          if [ -z "${{ steps.wiring.outputs.course }}" ]; then
            echo "::error::No Canvas course number — fill canvas_course in courses/micro_build_ai/__course.yml, or type one in the dispatch box."; fail=1
          fi
          if [ -z "${{ secrets.CANVAS_TOKEN }}" ]; then
            echo "::error::No CANVAS_TOKEN secret — lab repo → Settings → Secrets and variables → Actions → New repository secret."; fail=1
          fi
          exit $fail

      - name: Lint, then write unpublished
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_HOST: ${{ steps.wiring.outputs.host }}
        run: |
          set -o pipefail
          {
            echo "## 📝 ${{ inputs.spec }} → course ${{ steps.wiring.outputs.course }} (unpublished)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          python3 tools/canvas_quiz.py "${{ inputs.action || 'push' }}" "${{ inputs.spec }}" \
            --course "${{ steps.wiring.outputs.course }}" 2>&1 | tee -a /tmp/out.txt "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Report to the console
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fine-grained author keys cannot read check-runs (GitHub offers no
          # Checks permission for them — field-discovered 2026-08-22), so the
          # verdict rides a channel they CAN read: an orphan git blob (no
          # path, no branch, GC'd) announced by a commit status whose
          # description is the blob sha. The console holds Contents read
          # already and needs only Commit statuses read.
          touch /tmp/out.txt
          [ -s /tmp/out.txt ] || echo "The run stopped before producing output — its guard names the missing piece (course number or secret)." > /tmp/out.txt
          STATE="${{ job.status == 'success' && 'success' || 'failure' }}"
          BLOB=$(jq -n --rawfile c /tmp/out.txt '{content: $c, encoding: "utf-8"}' \
            | curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" -d @- \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" | jq -r .sha)
          jq -n --arg s "$STATE" --arg d "$BLOB" \
                '{state: (if $s == "success" then "success" else "failure" end),
                  context: "lc/quiz-canvas", description: $d}' \
            | curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" -d @- \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            | jq -r 'if .id then "filed status \(.id) → blob" else "status refused: \(.message)" end'
