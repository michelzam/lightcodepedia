name: UX Tests

on:
  # pedia: auto-run after its Jekyll deploy workflow completes.
  workflow_run:
    workflows: ["Deploy Jekyll to GitHub Pages"]
    types: [completed]
  # pedia: a tests-only publish deploys NOTHING — the Pages workflow's
  # docs/** paths filter never fires, so the chain above stays silent and
  # the board keeps showing the previous verdict. A fixed test looked
  # forever-red until someone dispatched by hand (2026-08-10). The site is
  # unchanged in that case, so running straight off the push races nothing.
  # The job guard keeps this pedia-only; on the lab it lands as a skipped
  # run (the nightly-budget ruling of 2026-07-31 stands).
  push:
    paths:
      - "tests/**"
      - "behave.ini"
  # lab: ONE nightly fast pass instead of one per push — 42 push runs in five
  # days spent the month's private-repo minutes (100% on Jul 31, budgets $0
  # with stop-usage). The local rig verifies before every push and pedia's
  # free full suite stays the authority at publish; the nightly stamp only
  # keeps the board honest. (Michel, 2026-07-31 — supersedes the per-push
  # policy of 2026-07-22.)
  schedule:
    - cron: "47 6 * * *"
  # Run manually from the Actions tab → "Run workflow" (no terminal needed)
  workflow_dispatch:
    inputs:
      only:
        description: "Run ONE feature only (e.g. runner, avatar, classroom) — empty = full suite. Scoped runs burn far fewer private-repo minutes and don't overwrite the published results."
        required: false
        default: ""
      scenarios:
        description: "Run only scenarios whose name matches this regex (behave -n), e.g. the failing ones. Empty = no name filter. Scoped, so it doesn't overwrite the published results."
        required: false
        default: ""
      base_url:
        description: "Base URL to test against (empty = this repo's own live site)"
        required: false
        default: ""

# One authoritative suite per ref. Three runs raced on 2026-07-26 (two pushes
# + a manual relaunch) and the board ended up showing the OLDEST commit's
# verdict with a fresh timestamp — last to FINISH won, not last to start. All
# three were green so it cost nothing, but on a red run that is a wrong number
# that looks current. A newer run now cancels the older one.
# Scoped runs (only= / scenarios=) never publish results, so they get their own
# group: a debug run must not cancel the full suite, nor be cancelled by it.
concurrency:
  # event_name is IN the key on purpose. Each repo runs on one trigger and
  # skips the others (lab: push; pedia: workflow_run) — but concurrency is
  # evaluated BEFORE the job-level if, so without this the workflow_run run
  # that was about to skip cancelled the push run that was about to work.
  # Nothing ran for three hours and the board went stale (2026-07-26).
  # A run may only cancel its own kind.
  group: ux-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.only || github.event.inputs.scenarios || 'full' }}
  cancel-in-progress: true

jobs:
  ux-tests:
    runs-on: ubuntu-latest
    # contents: push the results back to main
    # actions: dispatch the Pages workflow so the report gets deployed
    permissions:
      contents: write
      actions: write
      pages: read
    # Only run if triggered manually; on the lab's nightly schedule (not in
    # pedia — its own full run follows every deploy); or after pedia's deploy
    # succeeded (bot guard against result-commit loops).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       github.repository == 'michelzam/lightcodelab') ||
      (github.event_name == 'push' &&
       github.repository == 'michelzam/lightcodepedia' &&
       github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com')

    env:
      # Empty input → the repo's own site: unlisted lab Pages in the lab,
      # the canonical domain in the public repo.
      BASE_URL: ${{ github.event.inputs.base_url || (github.repository == 'michelzam/lightcodelab' && 'https://michelzam.github.io/lightcodelab' || 'https://lightcodepedia.org') }}
      # One feature name to scope the run; empty = whole suite. Used to build the
      # behave target and to gate publishing (a scoped run is a quick check, not
      # the canonical result set — it must not overwrite the full ux-results).
      ONLY: ${{ github.event.inputs.only }}
      # Optional behave -n name regex (e.g. run only the scenarios that failed).
      SCENARIOS: ${{ github.event.inputs.scenarios }}
      # FAST path (Michel, B): the lab's nightly run covers only the smoke +
      # component-spec subset, not the whole flow suite. Safe because the
      # authoritative full suite runs free in pedia on every Publish — the
      # nightly only needs early warning. A fast run never publishes the
      # board — the canonical verdict comes from the full run.
      FAST: ${{ github.event_name == 'schedule' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # A push run starts alongside the branch build — wait until Pages
      # actually serves THIS commit, or the suite tests the previous deploy.
      - name: Wait for the Pages branch build (push runs only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            b=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.status + " " + .commit' 2>/dev/null || echo "")
            echo "pages build: ${b:-unknown}"
            [ "$b" = "built ${{ github.sha }}" ] && exit 0
            sleep 10
          done
          echo "::warning::Pages build not confirmed after 5 min — testing whatever is live."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # A published feature leaning on a lab-only step is green here and red in
      # pedia, with "<unknown>" for a message. One second, before 14 minutes of
      # browser (2026-08-13).
      - name: Published features carry their own steps
        # the lab keeps the list; pedia has nothing to compare against
        if: github.repository == 'michelzam/lightcodelab'
        run: python tests/publish_parity.py

      # Cache the browser build so repeat runs skip the download (saves minutes).
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}

      # --with-deps means apt, and apt means Ubuntu's mirrors: on 2026-08-19
      # azure.archive.ubuntu.com stopped answering, the step hung for an HOUR,
      # GitHub killed the runner and the suite mailed "all jobs have failed"
      # without running a single scenario. The browser itself was already in
      # the cache — only the system libraries needed the network, and the
      # runner image ships them anyway. So: bound the apt half, and fall back
      # to the browser-only install. A red that means "Ubuntu had a bad day"
      # teaches nothing and hides the reds that matter.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: |
          if timeout 300 playwright install chromium --with-deps; then
            echo "browser + system deps ready"
          else
            echo "::warning::system-deps install failed or timed out — falling back to the browser alone (the runner image ships the libs)"
            playwright install chromium
          fi

      - name: Run BDD UX tests
        id: behave
        continue-on-error: true
        run: |
          TARGETS=(tests/features/)
          if [ -n "$ONLY" ]; then
            TARGETS=("tests/features/${ONLY}.feature")
          elif [ "$FAST" = "true" ]; then
            TARGETS=(tests/features/smoke.feature tests/features/component_specs.feature)
          fi
          NAME=(); [ -n "$SCENARIOS" ] && NAME=(-n "$SCENARIOS")
          echo "::notice::Running ${TARGETS[*]} ${NAME[*]} against $BASE_URL"
          behave "${TARGETS[@]}" "${NAME[@]}" --no-capture \
            -f json -o ux-report.json \
            -f behave_html_formatter:HTMLFormatter -o docs/assets/ux-report.html \
            -f progress2

      # Retry only helps the AUTO path (a red is usually a deploy race, tests
      # newer than the served Pages build). A manual run is intentional and the
      # owner can re-dispatch, so we skip the retry there — it would double the
      # private-repo minutes for no benefit.
      - name: Retry once after the dust settles
        id: behave2
        if: steps.behave.outcome == 'failure' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: |
          sleep 120
          TARGETS=(tests/features/)
          if [ -n "$ONLY" ]; then
            TARGETS=("tests/features/${ONLY}.feature")
          elif [ "$FAST" = "true" ]; then
            TARGETS=(tests/features/smoke.feature tests/features/component_specs.feature)
          fi
          NAME=(); [ -n "$SCENARIOS" ] && NAME=(-n "$SCENARIOS")
          behave "${TARGETS[@]}" "${NAME[@]}" --no-capture \
            -f json -o ux-report.json \
            -f behave_html_formatter:HTMLFormatter -o docs/assets/ux-report.html \
            -f progress2

      # A scoped run (ONLY/SCENARIOS) or a FAST lab-push run only exercised a
      # slice — publishing its report would wipe the other 130+ scenarios from
      # ux-results.json. Only the full suite (pedia deploy, or a manual full
      # dispatch) updates the canonical results shown on /nodes.
      - name: Build per-scenario results JSON
        if: always() && env.ONLY == '' && env.SCENARIOS == '' && env.FAST != 'true'
        run: python tests/report_to_results.py ux-report.json docs/assets/ux-results.json

      - name: Publish results to main
        if: always() && env.ONLY == '' && env.SCENARIOS == '' && env.FAST != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/ux-results.json docs/assets/ux-report.html docs/assets/ux-summary.json docs/assets/metrics.json docs/assets/metrics_trend.json
          if git diff --cached --quiet; then
            echo "No change in results."
          else
            git commit -m "chore: update UX test results"
            # The loop guard above stops ux-tests re-running on this bot commit.
            # Use merge -X ours so concurrent runs never hit a rebase conflict.
            git fetch origin main
            git merge origin/main -X ours --no-edit
            git push origin HEAD:main
            # GITHUB_TOKEN pushes don't trigger workflows implicitly, so
            # dispatch the Pages build explicitly to deploy the new report.
            # The bot-author loop guard stops ux-tests re-running after it.
            gh workflow run pages.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # LAB ONLY: bring pedia's FULL verdict home. The full suite runs free in
      # the public repo after every deploy and is the authority (2026-07-31);
      # the lab kept its own ux-summary.json from the last time it ran one, so
      # the board showed "✅ full suite · 297 scenarios · Aug 3" while the real
      # suite had grown to 452 and was green that morning (Michel, 2026-08-19:
      # "the full ux tests in the lab, old from August 3"). A stale number that
      # looks current is worse than no number. Mirroring costs zero minutes and
      # never travels: both files are in the publish gate's exclude list.
      - name: Mirror pedia's full-suite verdict
        if: always() && env.FAST == 'true' && github.repository == 'michelzam/lightcodelab'
        continue-on-error: true          # a mirror that fails must not fail the check
        run: |
          base=https://lightcodepedia.org/assets
          for f in ux-summary.json ux-results.json; do
            curl -fsS --max-time 30 "$base/$f" -o "/tmp/$f" \
              && python -c "import json,sys; json.load(open('/tmp/$f'))" \
              && mv "/tmp/$f" "docs/assets/$f" \
              || echo "::warning::could not mirror $f — keeping the local copy"
          done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/ux-summary.json docs/assets/ux-results.json
          if git diff --cached --quiet; then
            echo "Verdict unchanged."
          else
            git commit -m "chore: mirror pedia's full-suite verdict"
            git fetch origin main
            git merge origin/main -X ours --no-edit
            git push origin HEAD:main
          fi

      # FAST path only: stamp a tiny "this commit passed the quick check" marker
      # so the board never LOOKS stale between full runs. It carries its own
      # fresh run timestamp + the commit, and lives in ux-fast.json — never
      # ux-summary.json — so it can't overwrite the canonical full-suite verdict.
      # Reuses the full board's counter, run into a temp dir so it can't touch
      # docs/assets/ux-summary.json.
      - name: Stamp the fast check
        if: always() && env.FAST == 'true'
        run: |
          mkdir -p /tmp/fast
          python tests/report_to_results.py ux-report.json /tmp/fast/results.json || true
          python - <<'PY'
          import json, os
          src = "/tmp/fast/ux-summary.json"
          row = (json.load(open(src)) or [{}])[0] if os.path.exists(src) else {}
          row["commit"] = os.environ.get("GITHUB_SHA", "")[:7]
          row["subset"] = "smoke + component specs"
          json.dump([row], open("docs/assets/ux-fast.json", "w"), indent=1)
          PY
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/ux-fast.json
          if git diff --cached --quiet; then
            echo "No change in fast stamp."
          else
            git commit -m "chore: fast check stamp"
            # Same loop guard + conflict-proof merge as the full publish above.
            git fetch origin main
            git merge origin/main -X ours --no-edit
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts on failure
        if: steps.behave.outcome == 'failure' && steps.behave2.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: behave-results
          path: |
            ux-report.json
            docs/assets/ux-report.html
            *.png

      - name: Fail job if any scenario failed
        if: steps.behave.outcome == 'failure' && steps.behave2.outcome != 'success'
        run: exit 1
