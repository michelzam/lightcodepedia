name: Canvas roster facts → triptych desk

# The triptych desk's data road — manual only, fired from /lab/students.
# Browsers cannot call Canvas (its CORS policy), so the facts are read here,
# where the token lives in an Actions secret, and ride back as an orphan
# blob announced by a commit status (the same channel as the roster gate).
# Nothing is stored: the JSON exists in the blob (unreachable without the
# author key, GC'd) and in Michel's open tab.

on:
  workflow_dispatch:
    inputs:
      course:
        description: "Canvas course # (blank = courses/micro_build_ai/__course.yml)"
        default: ""

permissions:
  contents: write   # the facts travel as an orphan blob
  statuses: write   # ...announced by a commit status the author key can read

jobs:
  facts:
    # lab-only; if this file ever leaks through a publish, it stays inert
    if: github.repository == 'michelzam/lightcodelab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the course wiring
        id: wiring
        run: |
          python3 - "$COURSE_OVERRIDE" <<'PY' >> "$GITHUB_OUTPUT"
          import sys, yaml
          w = yaml.safe_load(open("courses/micro_build_ai/__course.yml"))
          course = sys.argv[1].strip() or str(w.get("canvas_course") or "").strip()
          print("course=%s" % course)
          print("host=%s" % (w.get("canvas_host") or "https://uwm.instructure.com"))
          PY
        env:
          COURSE_OVERRIDE: ${{ inputs.course }}

      - name: Guard — course named, token present
        run: |
          fail=0
          if [ -z "${{ steps.wiring.outputs.course }}" ]; then
            echo "::error::No Canvas course number — fill canvas_course in courses/micro_build_ai/__course.yml, or type one in the dispatch box."; fail=1
          fi
          if [ -z "${{ secrets.CANVAS_TOKEN }}" ]; then
            echo "::error::No CANVAS_TOKEN secret — lab repo → Settings → Secrets and variables → Actions."; fail=1
          fi
          exit $fail

      - name: Read the facts
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_HOST: ${{ steps.wiring.outputs.host }}
        run: |
          set -o pipefail
          python3 tools/student_facts.py "${{ steps.wiring.outputs.course }}" > /tmp/out.txt
          # the summary carries the COUNT only — the facts are the blob's business
          echo "## 🧑‍🎓 course ${{ steps.wiring.outputs.course }}: $(python3 -c 'import json;print(len(json.load(open("/tmp/out.txt"))))') student(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Report to the console
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch /tmp/out.txt
          [ -s /tmp/out.txt ] || echo "The run stopped before producing facts — its guard names the missing piece." > /tmp/out.txt
          STATE="${{ job.status == 'success' && 'success' || 'failure' }}"
          BLOB=$(jq -n --rawfile c /tmp/out.txt '{content: $c, encoding: "utf-8"}' \
            | curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" -d @- \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" | jq -r .sha)
          jq -n --arg s "$STATE" --arg d "$BLOB" \
                '{state: (if $s == "success" then "success" else "failure" end),
                  context: "lc/student-facts", description: $d}' \
            | curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" -d @- \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            | jq -r 'if .id then "filed status \(.id) → blob" else "status refused: \(.message)" end'
