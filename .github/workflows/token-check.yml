name: Token check

# How long each GitHub token the gates use still lives (Michel 2026-10-13,
# after npm's token expired unannounced). Weekly + on demand; red when a token
# is refused or has under 14 days left, so GitHub mails Michel about it.
# npm needs no line: it publishes by trusted publishing, no token.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, before the week's publishes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'michelzam/lightcodelab'
    runs-on: ubuntu-latest
    steps:
      - name: Days left per token
        env:
          PEDIA_PUSH_TOKEN: ${{ secrets.PEDIA_PUSH_TOKEN }}
          ORG_VAULT_TOKEN: ${{ secrets.ORG_VAULT_TOKEN }}
          A11Y_SCAN_PAT: ${{ secrets.A11Y_SCAN_PAT }}
        run: |
          bad=0
          for name in PEDIA_PUSH_TOKEN ORG_VAULT_TOKEN A11Y_SCAN_PAT; do
            tok="${!name}"
            if [ -z "$tok" ]; then echo "· $name — not set"; continue; fi
            head=$(curl -sS -o /dev/null -D - -w '%{http_code}' \
                   -H "Authorization: Bearer $tok" https://api.github.com/rate_limit)
            code=$(printf '%s' "$head" | tail -c 3)
            exp=$(printf '%s' "$head" | grep -i '^github-authentication-token-expiration:' \
                  | cut -d' ' -f2- | tr -d '\r')
            if [ "$code" != "200" ]; then
              echo "::error::$name is refused by GitHub (HTTP $code) — renew it"; bad=1; continue
            fi
            if [ -z "$exp" ]; then echo "✓ $name — no expiration"; continue; fi
            days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
            if [ "$days" -lt 14 ]; then
              echo "::error::$name expires in $days days ($exp) — renew it"; bad=1
            elif [ "$days" -lt 30 ]; then
              echo "::warning::$name expires in $days days ($exp)"
            else
              echo "✓ $name — $days days left ($exp)"
            fi
          done
          exit $bad
